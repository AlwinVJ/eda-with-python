name: Deploy to GitHub Pages

on:
  # Allows manual triggering when ready to deploy
  workflow_dispatch:
  # Enable continuous deployment on push:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate content metadata
        run: npm run validate:metadata

      - name: Build static site
        run: npm run build
        env:
          # Automatically uses /repository-name/ for GitHub Pages project sites
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ONETAG_KEY: ${{ secrets.VITE_ONETAG_KEY || vars.VITE_ONETAG_KEY || '' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
