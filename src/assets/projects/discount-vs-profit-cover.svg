<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 700; }
      .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 8px; fill: #64748b; }
      .text-axis { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 8.5px; fill: #64748b; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1px; stroke-dasharray: 3 3; }
      .axis-zero { stroke: #94a3b8; stroke-width: 1.25px; }
      .border-box { stroke: #cbd5e1; stroke-width: 1px; fill: none; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #16222d; }
        .grid-line { stroke: #2a3e52; }
        .axis-zero { stroke: #567c8d; }
        .text-sub { fill: #94a3b8; }
        .text-axis { fill: #94a3b8; }
        .badge-bg { fill: #223446; stroke: #2a3e52; }
      }
    </style>
    <linearGradient id="trend-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="26%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="profit-zone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="loss-zone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.16" />
    </linearGradient>
  </defs>

  <rect width="400" height="225" class="bg" />

  <!-- Zones -->
  <rect x="52" y="32" width="80" height="64" rx="4" fill="url(#profit-zone-grad)" />
  <rect x="132" y="96" width="240" height="92" rx="4" fill="url(#loss-zone-grad)" />

  <!-- Grid lines -->
  <line x1="52" y1="64" x2="372" y2="64" class="grid-line" />
  <line x1="52" y1="128" x2="372" y2="128" class="grid-line" />
  <line x1="52" y1="160" x2="372" y2="160" class="grid-line" />
  <line x1="52" y1="96" x2="372" y2="96" class="axis-zero" />

  <line x1="52" y1="32" x2="52" y2="188" stroke="#94a3b8" stroke-width="1" />
  <line x1="212" y1="32" x2="212" y2="188" class="grid-line" />
  <line x1="292" y1="32" x2="292" y2="188" class="grid-line" />
  <line x1="372" y1="32" x2="372" y2="188" class="grid-line" />

  <!-- 20% Threshold dividing line -->
  <line x1="132" y1="24" x2="132" y2="190" stroke="#f59e0b" stroke-dasharray="4 3" stroke-width="1.75" />

  <!-- 20% Cliff badge -->
  <rect x="105" y="9" width="54" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
  <text x="132" y="21" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9px" font-weight="700" fill="#b45309">20% CLIFF</text>

  <!-- Labels -->
  <text x="60" y="46" class="text-title" fill="#059669">PROFITABLE (&#8804;20%)</text>
  <text x="60" y="56" class="text-sub">+33.8% avg margin</text>

  <text x="264" y="172" class="text-title" fill="#dc2626">LOSS ZONE (&gt;20%)</text>
  <text x="264" y="182" class="text-sub">-60.5% avg margin</text>

  <!-- Scatter points -->
  <circle cx="52" cy="52" r="3" fill="#10b981" fill-opacity="0.85" />
  <circle cx="52" cy="68" r="2.5" fill="#10b981" fill-opacity="0.75" />
  <circle cx="52" cy="44" r="3.2" fill="#10b981" fill-opacity="0.8" />
  <circle cx="62" cy="58" r="2.2" fill="#10b981" fill-opacity="0.8" />
  <circle cx="70" cy="78" r="2.8" fill="#10b981" fill-opacity="0.75" />
  <circle cx="76" cy="48" r="3" fill="#10b981" fill-opacity="0.85" />
  <circle cx="86" cy="64" r="2.4" fill="#10b981" fill-opacity="0.8" />
  <circle cx="94" cy="54" r="3" fill="#10b981" fill-opacity="0.85" />
  <circle cx="104" cy="72" r="2.8" fill="#10b981" fill-opacity="0.75" />
  <circle cx="112" cy="62" r="2.6" fill="#10b981" fill-opacity="0.8" />
  <circle cx="122" cy="78" r="3" fill="#10b981" fill-opacity="0.8" />
  <circle cx="128" cy="88" r="2.8" fill="#10b981" fill-opacity="0.75" />

  <circle cx="142" cy="106" r="2.6" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="152" cy="118" r="3" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="164" cy="132" r="3.2" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="176" cy="114" r="2.5" fill="#ef4444" fill-opacity="0.75" />
  <circle cx="188" cy="142" r="3" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="202" cy="154" r="3" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="214" cy="138" r="2.5" fill="#ef4444" fill-opacity="0.75" />
  <circle cx="226" cy="160" r="3.5" fill="#ef4444" fill-opacity="0.9" />
  <circle cx="244" cy="148" r="3" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="258" cy="168" r="3.2" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="274" cy="156" r="2.7" fill="#ef4444" fill-opacity="0.75" />
  <circle cx="292" cy="172" r="3.2" fill="#ef4444" fill-opacity="0.9" />
  <circle cx="312" cy="166" r="3" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="332" cy="178" r="3.2" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="352" cy="174" r="3" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="370" cy="180" r="3.2" fill="#ef4444" fill-opacity="0.9" />

  <!-- Trendline -->
  <path d="M 52,56 C 82,62 108,76 132,94 C 158,114 186,138 232,154 C 282,168 328,174 372,178" fill="none" stroke="url(#trend-grad)" stroke-width="2.75" stroke-linecap="round" />

  <!-- Axis labels -->
  <text x="46" y="67" text-anchor="end" class="text-axis">+$100</text>
  <text x="46" y="99" text-anchor="end" class="text-axis" font-weight="700">$0</text>
  <text x="46" y="131" text-anchor="end" class="text-axis">-$100</text>
  <text x="46" y="163" text-anchor="end" class="text-axis">-$200</text>

  <text x="52" y="202" text-anchor="middle" class="text-axis">0%</text>
  <text x="132" y="202" text-anchor="middle" class="text-axis" font-weight="700" fill="#d97706">20%</text>
  <text x="212" y="202" text-anchor="middle" class="text-axis">40%</text>
  <text x="292" y="202" text-anchor="middle" class="text-axis">60%</text>
  <text x="372" y="202" text-anchor="middle" class="text-axis">80%</text>

  <text x="372" y="216" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8px" fill="#64748b" font-weight="600">DISCOUNT RATE &#8594;</text>
  <text x="52" y="22" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8px" fill="#64748b" font-weight="600">&#8593; PROFIT ($)</text>

  <!-- Metric badge -->
  <rect x="248" y="9" width="124" height="17" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.75" class="badge-bg" />
  <text x="310" y="21" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5px" font-weight="600" fill="#475569">Pearson r = -0.86 (Margin)</text>
</svg>
